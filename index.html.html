<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil Nutrição — Monitoria de NC2</title>
<style>
:root{
  --ink:#151515; --paper:#f7f6f2; --paper2:#eeece6; --line:#d5d2ca;
  --accent:#e84545; --accent2:#1f7a63; --muted:#68665f; --white:#fff;
  --shadow:0 16px 45px rgba(0,0,0,.10);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#dcdad4}
body{
  background:
    radial-gradient(circle at 20% 20%,rgba(0,0,0,.035) 0 1px,transparent 1.5px),
    radial-gradient(circle at 70% 65%,rgba(0,0,0,.025) 0 1px,transparent 1.5px),
    linear-gradient(115deg,#f4f3ef,#e8e6df);
  background-size:5px 5px,7px 7px,100% 100%;
}
button,input,select{font:inherit}
button{cursor:pointer}
.app{min-height:100vh}
.topbar{
  position:sticky;top:0;z-index:50;background:rgba(247,246,242,.94);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;padding:13px 22px;
}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brandmark{font-family:Georgia,serif;font-weight:900;font-size:29px;letter-spacing:-2px;text-shadow:2px 2px 0 #fff}
.brand small{display:block;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.nav button,.btn{
  border:1px solid #c9c6bf;background:#fff;border-radius:12px;padding:9px 13px;font-weight:800;
  transition:.18s transform,.18s box-shadow,.18s background;
}
.nav button:hover,.btn:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(0,0,0,.08)}
.nav button.active,.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.red{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.green{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.btn.ghost{background:transparent}
.btn.big{padding:13px 18px;font-size:16px}
main{max-width:1240px;margin:0 auto;padding:30px 20px 70px}
.hero{
  min-height:430px;display:grid;grid-template-columns:1.15fr .85fr;gap:30px;align-items:center;
  background:rgba(250,249,246,.76);border:1px solid #d2d0ca;border-radius:26px;padding:42px;
  box-shadow:var(--shadow);overflow:hidden;position:relative;
}
.hero:before{content:"";position:absolute;inset:0;opacity:.22;pointer-events:none;background:
  radial-gradient(circle at 10% 10%,#000 0 1px,transparent 1.5px);
  background-size:7px 7px}
.hero>*{position:relative}
.kicker{font-weight:900;letter-spacing:.13em;text-transform:uppercase;color:#555}
.hero h1{font-family:Georgia,serif;font-size:clamp(58px,8vw,108px);line-height:.8;margin:12px 0 8px;letter-spacing:-6px;text-shadow:3px 3px 0 #fff,-1px -1px 0 #000}
.hero h2{font-size:24px;margin:0 0 18px;letter-spacing:.12em}
.hero p{font-size:17px;line-height:1.55;max-width:650px}
.hero-art{display:flex;justify-content:center;align-items:center}
.card-stack{position:relative;width:300px;height:310px}
.mini-card{position:absolute;width:190px;height:260px;border:3px solid #111;background:#f7f6f2;box-shadow:10px 14px 0 rgba(0,0,0,.08);border-radius:9px;padding:22px;font-family:Georgia,serif}
.mini-card:nth-child(1){transform:rotate(-12deg);left:12px;top:24px}
.mini-card:nth-child(2){transform:rotate(2deg);left:58px;top:5px}
.mini-card:nth-child(3){transform:rotate(13deg);left:112px;top:32px}
.mini-card .mc-top{font:900 11px Arial;letter-spacing:.1em}
.mini-card .mc-title{font-size:34px;font-weight:900;margin-top:32px}
.dots{display:flex;gap:6px;margin-top:18px}.dots i{width:10px;height:10px;border-radius:50%;background:#111;display:block}
.section-title{display:flex;align-items:end;justify-content:space-between;gap:15px;margin:38px 0 18px}
.section-title h2{margin:0;font-family:Georgia,serif;font-size:32px}
.section-title p{margin:0;color:var(--muted)}
.mode-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.mode{
  background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;min-height:150px;text-align:left;
  box-shadow:0 8px 25px rgba(0,0,0,.05)
}
.mode h3{margin:8px 0;font-size:19px}.mode p{color:#666;line-height:1.4;margin:0}.mode .icon{font-size:30px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
.stat{background:#fff;border:1px solid var(--line);padding:18px;border-radius:16px}.stat b{font:900 30px Georgia}.stat span{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.page-head{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:22px}
.page-head h1{font-family:Georgia,serif;font-size:42px;margin:0 0 5px}.page-head p{margin:0;color:var(--muted)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.search{flex:1;min-width:230px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}
.filters{display:flex;gap:7px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-weight:800}.filter.active{background:#111;color:#fff}
.card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.deck-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;min-height:215px;display:flex;flex-direction:column;box-shadow:0 8px 22px rgba(0,0,0,.05);transition:.18s}
.deck-card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.09)}
.badge{display:inline-flex;align-self:flex-start;padding:6px 9px;border-radius:999px;background:#efede7;font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
.deck-card h3{font-family:Georgia,serif;font-size:25px;margin:17px 0 8px;line-height:1.05}
.deck-card .macro{font-size:12px;color:var(--muted);font-weight:800}
.deck-card .clue-count{margin-top:auto;padding-top:16px;color:#777;font-size:13px}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:23px;box-shadow:0 8px 22px rgba(0,0,0,.05)}
.panel h3{margin:0 0 12px;font-family:Georgia,serif;font-size:24px}.panel p,.panel li{line-height:1.55}.panel ul,.panel ol{padding-left:21px}
.score-table{width:100%;border-collapse:collapse}.score-table th,.score-table td{padding:10px;border-bottom:1px solid var(--line);text-align:left}.score-table th{background:#f2f1ed}
.game-shell{display:grid;grid-template-columns:1fr 310px;gap:18px}
.game-main{min-width:0}
.game-card{
  background:#fff;border:2px solid #111;border-radius:22px;min-height:560px;padding:30px;box-shadow:var(--shadow);position:relative;
}
.game-top{display:flex;justify-content:space-between;gap:12px;align-items:start}
.game-category{font-weight:900;letter-spacing:.1em;text-transform:uppercase;font-size:13px}
.points{font-family:Georgia,serif;font-size:30px;font-weight:900}
.current-team{display:inline-block;margin-top:12px;padding:8px 12px;background:#111;color:#fff;border-radius:999px;font-weight:900}
.clue-area{margin:44px auto 0;max-width:780px;text-align:center}
.clue-number{color:#777;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.clue-text{font-family:Georgia,serif;font-size:clamp(27px,4vw,43px);line-height:1.14;margin:16px 0 24px}
.hidden-message{padding:35px;border:1px dashed #aaa;border-radius:16px;color:#777}
.game-actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:25px}
.timer{font:900 42px Georgia;margin:15px 0}.timer.warn{color:var(--accent)}
.side{display:flex;flex-direction:column;gap:14px}
.side .panel{padding:18px}
.team-row{display:flex;justify-content:space-between;align-items:center;padding:10px 11px;border:1px solid var(--line);border-radius:12px;margin:7px 0;background:#faf9f6}
.team-row.active{border:2px solid #111;padding:9px 10px}.team-row .score{font-weight:900;font-size:20px}.team-row button{border:0;background:transparent;font-weight:900}
.setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field label{display:block;font-size:12px;font-weight:900;text-transform:uppercase;color:#666;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff}
.team-inputs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.answer-box{background:#111;color:#fff;border-radius:16px;padding:20px;text-align:center;margin-top:20px}.answer-box small{color:#bbb;text-transform:uppercase;font-weight:900}.answer-box strong{display:block;font:900 30px Georgia;margin-top:5px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#111;color:#fff;padding:12px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:100}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}.modal-back.show{display:flex}
.modal{max-width:760px;width:100%;background:#fff;border-radius:22px;padding:26px;max-height:90vh;overflow:auto}.modal h2{font-family:Georgia,serif;margin-top:0}
.tie-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.footer{max-width:1240px;margin:0 auto;padding:0 20px 35px;color:#777;font-size:12px}

.credits-hero{background:rgba(250,249,246,.82);border:1px solid #d2d0ca;border-radius:26px;padding:42px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.credits-hero:before{content:"";position:absolute;inset:0;opacity:.16;pointer-events:none;background:radial-gradient(circle at 10% 10%,#000 0 1px,transparent 1.5px);background-size:7px 7px}
.credits-hero>*{position:relative}
.credits-mark{font-family:Georgia,serif;font-size:clamp(48px,7vw,82px);font-weight:900;letter-spacing:-4px;text-shadow:3px 3px 0 #fff,-1px -1px 0 #000;margin:0 0 12px}
.credit-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
.credit-line{padding:15px 0;border-bottom:1px solid var(--line)}
.credit-line:last-child{border-bottom:0}
.credit-line small{display:block;text-transform:uppercase;letter-spacing:.08em;font-weight:900;color:var(--muted);font-size:11px;margin-bottom:4px}
.credit-line strong{font-size:17px}
.credit-note{margin-top:22px;padding:16px 18px;border-left:4px solid var(--accent);background:#f4f2ec;border-radius:0 12px 12px 0;line-height:1.55}
@media(max-width:700px){.credit-grid{grid-template-columns:1fr}.credits-hero{padding:28px}}

.empty{padding:50px;text-align:center;color:#777;background:#fff;border:1px dashed var(--line);border-radius:18px}
@media(max-width:950px){.hero{grid-template-columns:1fr;padding:30px}.mode-grid{grid-template-columns:repeat(2,1fr)}.card-grid{grid-template-columns:repeat(2,1fr)}.game-shell{grid-template-columns:1fr}.rules{grid-template-columns:1fr}.side{order:2}}
@media(max-width:620px){.topbar{align-items:flex-start;flex-direction:column;gap:10px}.nav{justify-content:flex-start}.hero h1{font-size:65px}.mode-grid,.card-grid,.stats,.setup-grid{grid-template-columns:1fr}.team-inputs{grid-template-columns:1fr}.hero-art{display:none}.game-card{padding:20px;min-height:500px}.page-head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="toast" class="toast"></div>
<div id="modalBack" class="modal-back"><div id="modal" class="modal"></div></div>
<script>
const CARDS = [{"id": 1, "label": "PATOLOGIA", "macro": "Patologia", "name": "Síndrome de Cushing", "clues": ["Posso ser de origem endógena ou exógena.", "Promovo aumento do catabolismo proteico e resistência à ação da insulina.", "Frequentemente estou associada à hiperglicemia, hipertensão arterial e perda de massa muscular.", "Posso causar estrias violáceas, pele fina e equimoses fáceis.", "Sou a condição clínica resultante do excesso crônico de cortisol no organismo.", "Meus sinais clássicos incluem obesidade centrípeta, fácies em lua cheia e giba de búfalo."]}, {"id": 2, "label": "PATOLOGIA", "macro": "Patologia", "name": "Doença de Addison", "clues": ["Minha causa mais comum é a destruição autoimune do córtex adrenal.", "O aumento compensatório do ACTH está relacionado a um dos meus principais sinais clínicos.", "Provoco redução importante da produção de cortisol e aldosterona.", "Posso causar hiponatremia, hipercalemia e hipotensão arterial.", "Meus pacientes frequentemente apresentam fadiga intensa, perda de peso e desejo por alimentos salgados.", "Minha manifestação mais característica é a hiperpigmentação da pele e das mucosas."]}, {"id": 3, "label": "NUTRIENTE", "macro": "Nutrientes, enzimas e substâncias", "name": "Colesterol", "clues": ["Minha disponibilidade na célula adrenal aumenta após estímulo pelo ACTH.", "Posso ser obtido pela alimentação ou sintetizado principalmente no fígado.", "Sou o precursor comum da síntese de todos os hormônios esteroides.", "Também participo da formação dos hormônios sexuais e da vitamina D.", "Além da função hormonal, componho a estrutura das membranas celulares.", "Sou um lipídio frequentemente associado às lipoproteínas LDL e HDL."]}, {"id": 4, "label": "HORMÔNIO", "macro": "Hormônios", "name": "Angiotensina II", "clues": ["Sou um hormônio peptídico produzido na etapa final do sistema renina-angiotensina.", "Sou formado pela ação da enzima conversora de angiotensina (ECA) sobre meu precursor.", "Minha produção aumenta em situações de hipovolemia, hipotensão ou redução da perfusão renal.", "Estimulo a secreção de aldosterona pelo córtex adrenal.", "Contribuo para o aumento da pressão arterial.", "Sou o principal hormônio responsável pela vasoconstrição."]}, {"id": 5, "label": "HORMÔNIO", "macro": "Hormônios", "name": "Cortisol", "clues": ["Sou sintetizado exclusivamente na zona fasciculada do córtex adrenal.", "Exerço retroalimentação negativa sobre CRH e ACTH.", "Estimulo a gliconeogênese hepática, favoreço a lipólise e participo da resposta ao estresse.", "Minha secreção segue um ritmo circadiano, com pico nas primeiras horas da manhã.", "Quando permaneço elevado cronicamente, posso causar Síndrome de Cushing.", "Sou conhecido como o hormônio do estresse."]}, {"id": 6, "label": "HORMÔNIO", "macro": "Hormônios", "name": "Aldosterona", "clues": ["Sou sintetizada na zona glomerulosa do córtex adrenal.", "Atuo nos túbulos distais e ductos coletores renais.", "Promovo reabsorção de sódio e excreção de potássio.", "Minha secreção é regulada principalmente pela angiotensina II.", "Sou fundamental para o controle da volemia e da pressão arterial.", "Sou o principal hormônio mineralocorticóide do organismo."]}, {"id": 7, "label": "HORMÔNIO", "macro": "Hormônios", "name": "ACTH (adrenocorticotrófico)", "clues": ["Sou um peptídeo derivado da molécula precursora POMC.", "Minha secreção é estimulada pelo CRH produzido no hipotálamo.", "Estimulo a captação de colesterol e a esteroidogênese no córtex adrenal.", "Meus níveis aumentam intensamente na insuficiência adrenal primária.", "Minha secreção antecede as variações diárias do cortisol.", "Sou o hormônio adrenocorticotrófico produzido pela adeno-hipófise."]}, {"id": 8, "label": "SINAL CLÍNICO", "macro": "Sinais Clínicos", "name": "Giba de Búfalo", "clues": ["Resulto da redistribuição anormal do tecido adiposo induzida pelo excesso de cortisol.", "Sou um dos principais sinais físicos do hipercortisolismo.", "Costumo ocorrer juntamente com obesidade centrípeta.", "Frequentemente acompanho a fácies em lua cheia", "Correspondo ao acúmulo de gordura na região cervical posterior.", "Também sou conhecida como \"corcova\" da Síndrome de Cushing."]}, {"id": 9, "label": "SINAL CLÍNICO", "macro": "Sinais Clínicos", "name": "Hiperpigmentação", "clues": ["Minha ocorrência está relacionada ao aumento compensatório do ACTH derivado da POMC.", "Sou causada pelo aumento concomitante da produção de hormônio estimulador de melanócitos.", "Posso ser observada na pele, cicatrizes recentes e mucosa oral.", "Sou altamente sugestiva de insuficiência adrenal primária.", "Reflito a destruição crônica do córtex adrenal.", "Sou o escurecimento característico da pele encontrado na Doença de Addison. PERFIL PERFIL PERFIL NUTRIÇÃO MONITORIA DE NC2 PERFIL PERFIL PERFIL NUTRIÇÃO MONITORIA DE NC2 PERFIL PERFIL PERFIL NUTRIÇÃO MONITORIA DE NC2 PERFIL PERFIL PERFIL NUTRIÇÃO MONITORIA DE NC2 PERFIL PERFIL PERFIL NUTRIÇÃO MONITORIA DE NC2 PERFIL PERFIL PERFIL NUTRIÇÃO MONITORIA DE NC2 PERFIL PERFIL PERFIL NUTRIÇÃO MONITORIA DE NC2 PERFIL PERFIL PERFIL NUTRIÇÃO MONITORIA DE NC2 PERFIL PERFIL PERFIL NUTRIÇÃO MONITORIA DE NC2"]}, {"id": 10, "label": "HORMÔNIO", "macro": "Hormônios", "name": "CRH (Liberador de Corticotrofina)", "clues": ["Sou sintetizado por neurônios localizados no núcleo paraventricular do hipotálamo.", "Minha secreção aumenta em situações de estresse físico e psicológico.", "Atuo sobre células corticotróficas da adeno-hipófise.", "Estimulo diretamente a liberação de ACTH.", "Minha atividade é inibida pelo cortisol através de feedback negativo.", "Sou o hormônio hipotalâmico que inicia o eixo hipotálamo-hipófise-adrenal."]}, {"id": 11, "label": "PATOLOGIA", "macro": "Patologia", "name": "Hipotireoidismo", "clues": ["Na dietoterapia, geralmente é indicada uma alimentação normocalórica ou hipocalórica, conforme o estado nutricional.", "Reduzo o consumo energético e a termogênese do organismo.", "Meus pacientes apresentam bradicardia, sonolência, intolerância ao frio e pele seca.", "Provoco diminuição generalizada da Taxa Metabólica Basal.", "Sou identificado laboratorialmente por TSH elevado e T4 livre reduzido.", "Sou a síndrome clínica decorrente da deficiência da produção ou da ação dos hormônios tireoidianos."]}, {"id": 12, "label": "PATOLOGIA", "macro": "Patologia", "name": "Doença de Graves", "clues": ["Resulto da perda da autotolerância imunológica contra componentes da tireoide.", "Caracterizo-me pela produção de autoanticorpos estimuladores do receptor de TSH.", "Promovo hiperestimulação da glândula, levando ao hipertireoidismo", "Meus pacientes frequentemente apresentam perda de peso, taquicardia e intolerância ao calor.", "Posso causar bócio difuso, exoftalmia e mixedema pré-tibial.", "Sou a principal causa de hipertireoidismo."]}, {"id": 13, "label": "PATOLOGIA", "macro": "Patologia", "name": "Hiperparatireoidismo Secundário", "clues": ["Desenvolvo-me em resposta a estímulos persistentes externos às paratireoides.", "Sou desencadeado pela retenção de fósforo, redução da vitamina D ativa e hipocalcemia.", "Ocorro principalmente em pacientes com Doença Renal Crônica.", "Sou uma resposta compensatória à hipocalcemia crônica.", "Posso provocar osteodistrofia renal e desmineralização óssea.", "Caracterizo-me pela elevação persistente dos níveis de PTH como mecanismo compensatório."]}, {"id": 14, "label": "PATOLOGIA", "macro": "Patologia", "name": "Cretinismo (Hipotireoidismo Congênito)", "clues": ["Posso decorrer de disgenesia tireoidiana ou deficiência materna de iodo.", "Comprometo intensamente o crescimento e o desenvolvimento neurológico.", "Manifesto letargia, constipação e hérnia umbilical nas primeiras semanas de vida.", "Caracterizo-me por língua protrusa, baixa estatura e atraso do desenvolvimento.", "Resulto da deficiência grave de hormônios tireoidianos desde o nascimento.", "Sou o hipotireoidismo congênito não tratado."]}, {"id": 15, "label": "HORMÔNIO", "macro": "Hormônios", "name": "Paratormônio", "clues": ["Sou produzido pelas células principais das glândulas paratireoides.", "Estimulo a enzima renal 1-alfa-hidroxilase, aumentando a produção de vitamina D ativa.", "Aumento a reabsorção renal de cálcio e estimulo a mobilização óssea.", "Minha secreção aumenta quando a concentração de cálcio sérico diminui.", "Atuo na manutenção da homeostase do cálcio e do fósforo.", "Sou o principal hormônio das paratireóides."]}, {"id": 16, "label": "ENZIMA", "macro": "Nutrientes, enzimas e substâncias", "name": "Glutationa Peroxidase (GPx)", "clues": ["Atuo protegendo células contra o estresse oxidativo.", "Cataliso a degradação do peróxido de hidrogênio (H₂O₂).", "Minha deficiência compromete a proteção da tireoide e o metabolismo dos hormônios tireoidianos.", "Sou uma importante enzima antioxidante do organismo.", "Sou uma enzima cuja atividade depende da presença de selenocisteína.", "Minha síntese depende diretamente da disponibilidade de selênio."]}, {"id": 17, "label": "NUTRIENTE", "macro": "Nutrientes, enzimas e substâncias", "name": "Iodo", "clues": ["Participo da organificação ao me ligar aos resíduos de tirosina da tireoglobulina.", "Minha deficiência aumenta a secreção de TSH e favorece a hiperplasia da glândula.", "Sou indispensável para a síntese dos hormônios T3 e T4.", "Sou um micronutriente essencial para o funcionamento da tireoide.", "Sou o único micronutriente incorporado diretamente à estrutura dos hormônios tireoidianos.", "No Brasil, sou adicionado obrigatoriamente ao sal de cozinha."]}, {"id": 18, "label": "SINAL CLÍNICO", "macro": "Sinais Clínicos", "name": "Bócio", "clues": ["Resulto da hiperplasia e hipertrofia das células da glândula tireoide.", "Posso ocorrer tanto no hipertireoidismo quanto no hipotireoidismo.", "Frequentemente relaciono-me à deficiência de iodo ou ao excesso de estímulo por TSH.", "Manifesto aumento visível ou palpável da região anterior do pescoço.", "Sou um importante sinal clínico em doenças  const c=state.studyCard;
 const el=document.getElementById("study-answer");
 if(el)el.innerHTML=`<div class="answer-box"><small>Resposta</small><strong>${esc(c.name)}</strong><div style="margin-top:8px;color:#ccc;font-size:13px">Categoria original: ${esc(c.label)}</div></div>`;
}
function resetGame(){
 clearInterval(state.timerId);state.timerId=null;state.teams=[{name:"Equipe 1",score:0},{name:"Equipe 2",score:0}];state.teamCount=2;state.activeTeam=0;state.card=null;state.clue=0;state.timer=30;state.roundStarted=false;state.revealedAnswer=false;state.used=new Set();state.tie=false;state.tieTeams=[];state.tieCard=null;state.tieClue=0;state.tieReady=false;
}
function renderGame(){
 if(!state.card){
  shell(`<div class="page-head"><div><h1>Modo Jogo</h1><p>Configuração rápida para o monitor.</p></div><button class="btn" onclick="resetGame();renderGame()">Reiniciar</button></div>
  <div class="panel"><h3>Antes de começar</h3><p>O manual estabelece equipes de <b>6 participantes</b>, um porta-voz por equipe e o monitor como mediador. Configure apenas os nomes das equipes abaixo.</p>
   <div class="field" style="max-width:260px"><label>Número de equipes</label><select id="teamCount" onchange="setTeamCount(this.value)">${[2,3,4,5,6,7,8].map(n=>`<option ${state.teamCount==n?"selected":""}>${n}</option>`).join("")}</select></div>
   <div class="team-inputs">${state.teams.map((t,i)=>`<input class="search" style="min-width:0" value="${esc(t.name)}" oninput="state.teams[${i}].name=this.value" placeholder="Equipe ${i+1}">`).join("")}</div>
   <div style="margin-top:20px;display:flex;gap:9px;flex-wrap:wrap"><button class="btn red big" onclick="startRound()">Sortear primeira carta</button><button class="btn" onclick="showRules()">Ver regras antes de jogar</button></div>
  </div>`);
  return;
 }
 const c=state.card, clue=state.clue, pts=clue<6?POINTS[clue]:1;
 shell(`<div class="page-head"><div><h1>Modo Jogo</h1><p>Rodada ${state.roundStarted?"em andamento":"pronta"} · ${state.used.size} carta(s) já sorteada(s).</p></div><div><button class="btn" onclick="newRound()">Nova carta</button> <button class="btn" onclick="resetGame();renderGame()">Reiniciar partida</button></div></div>
 <div class="game-shell"><div class="game-main"><div class="game-card">
   <div class="game-top"><div><div class="game-category">A carta da vez é uma ${esc(c.label)}</div><span class="current-team">Vez: ${esc(state.teams[state.activeTeam].name)}</span></div><div class="points">${clue<6?POINTS[clue]:"—"} pts</div></div>
   <div class="clue-area">${clue===0?`<div class="hidden-message"><b>1ª pista: 6 pontos</b><br>Leia a pista para a equipe e inicie os 30 segundos.</div>`:`<div class="clue-number">Pista ${clue} · ${POINTS[clue-1]} pontos</div><div class="clue-text">${esc(c.clues[clue-1])}</div>`}
    ${state.timerId?`<div class="timer ${state.timer<=5?"warn":""}">${state.timer}s</div>`:`<div class="timer">${state.timer}s</div>`}
    <div class="game-actions">
      ${clue<6?`<button class="btn primary big" onclick="revealGameClue()">${clue===0?"Ler 1ª pista":"Ler próxima pista"}</button>`:""}
      ${clue>0?`<button class="btn" onclick="startTimer()">Iniciar 30 s</button><button class="btn green" onclick="correct()">Acertou</button><button class="btn" onclick="wrong()">Errou / passou</button>`:""}
      <button class="btn" onclick="revealGameAnswer()">Revelar resposta</button>
    </div>
    <div id="game-answer"></div>
   </div></div>
   <aside class="side"><div class="panel"><h3>Placar</h3>${state.teams.map((t,i)=>`<div class="team-row ${i===state.activeTeam?"active":""}"><span>${esc(t.name)}</span><span class="score">${t.score}</span></div>`).join("")}</div>
   <div class="panel"><h3>Próxima ação</h3><p style="margin-top:0;color:#666">Se errar ou passar, a vez passa no sentido horário e a próxima pista é liberada.</p><button class="btn big" style="width:100%" onclick="newRound()">Sortear nova carta</button><button class="btn" style="width:100%;margin-top:8px" onclick="openTie()">Desempate</button></div>
   </aside></div>`);
}
function setTeamCount(v){
 state.teamCount=Number(v);
 const old=state.teams.map(x=>x.name);
 state.teams=Array.from({length:state.teamCount},(_,i)=>({name:old[i]||`Equipe ${i+1}`,score:0}));
 renderGame();
}
function availableCards(){return CARDS.filter(c=>!state.used.has(c.id))}
function startRound(){
 const available=availableCards();
 if(!available.length){toast("Todas as cartas já foram usadas.");return}
 const c=available[Math.floor(Math.random()*available.length)];state.used.add(c.id);state.card=c;state.clue=0;state.activeTeam=0;state.roundStarted=true;state.revealedAnswer=false;state.timer=30;clearInterval(state.timerId);state.timerId=null;renderGame()
}
function newRound(){
 const available=availableCards();
 if(!available.length){toast("O baralho terminou.");return}
 const c=available[Math.floor(Math.random()*available.length)];state.used.add(c.id);state.card=c;state.clue=0;state.revealedAnswer=false;state.timer=30;clearInterval(state.timerId);state.timerId=null;renderGame()
}
function revealGameClue(){
 if(state.clue>=6)return;
 state.clue++;
 state.timer=30; clearInterval(state.timerId);state.timerId=null;renderGame();
}
function startTimer(){
 clearInterval(state.timerId);state.timer=30;
 state.timerId=setInterval(()=>{state.timer--;if(state.timer<=0){clearInterval(state.timerId);state.timerId=null;toast("Tempo esgotado!");}renderGame()},1000);
 renderGame()
}
function stopTimer(){clearInterval(state.timerId);state.timerId=null}
function correct(){
 stopTimer(); const p=POINTS[state.clue-1]||1; state.teams[state.activeTeam].score+=p;
 toast(`${state.teams[state.activeTeam].name} +${p} ponto(s)`);
 renderGame();
}
function wrong(){
 stopTimer();
 if(state.clue<6){state.activeTeam=(state.activeTeam+1)%state.teams.length;state.clue++;state.timer=30;renderGame();toast("Vez transferida. Próxima pista liberada.");}
 else{toast("Última pista. Revele a resposta e inicie nova rodada.");renderGame()}
}
function revealGameAnswer(){
 const el=document.getElementById("game-answer");
 if(el)el.innerHTML=`<div class="answer-box"><small>Resposta</small><strong>${esc(state.card.name)}</strong><div style="margin-top:8px;color:#ccc;font-size:13px">Categoria original: ${esc(state.card.label)}</div><div style="margin-top:12px;font-size:12px;color:#bbb">Após a resposta, o manual prevê breve contextualização teórica pelo monitor.</div></div>`;
}
function showRules(){state.page="rules";render()}
function openTie(){
 const tied=state.teams.filter(t=>t.score===Math.max(...state.teams.map(x=>x.score)));
 if(tied.length<2){toast("É necessário haver empate entre pelo menos 2 equipes.");return}
 state.tie=true;state.tieTeams=tied.map(t=>state.teams.indexOf(t));state.tieCard=null;state.tieClue=0;state.tieReady=false;
 showTieModal()
}
function showTieModal(){
 const back=document.getElementById("modalBack"), modal=document.getElementById("modal");
 if(!state.tieCard){
  const arr=CARDS.filter(c=>!state.used.has(c.id)); if(!arr.length){modal.innerHTML="<h2>Desempate</h2><p>Não há cartas inéditas restantes.</p><button class='btn' onclick='closeModal()'>Fechar</button>";back.classList.add("show");return}
  state.tieCard=arr[Math.floor(Math.random()*arr.length)];state.used.add(state.tieCard.id);state.tieClue=0;state.tieReady=false;
 }
 const c=state.tieCard;
 modal.innerHTML=`<h2>Desempate</h2><p><b>Equipes empatadas:</b> ${state.tieTeams.map(i=>esc(state.teams[i].name)).join(", ")}</p>
 <div class="badge">${esc(c.label)}</div><div style="margin:20px 0">${state.tieClue<3?`<div style="font:700 25px Georgia;line-height:1.25">${state.tieClue===0?"Pronto para a 1ª pista.":esc(c.clues[state.tieClue-1])}</div>`:`<div style="font:700 25px Georgia;line-height:1.25">${esc(c.clues[2])}</div>`}</div>
 ${!state.tieReady&&state.tieClue<3?`<button class="btn primary" onclick="tieNext()">Ler ${state.tieClue+1}ª pista</button>`:""}
 ${state.tieClue===3&&!state.tieReady?`<button class="btn red big" onclick="tieReady()">1, 2, 3, valendo!</button>`:""}
 ${state.tieReady?`<h3>Quem levantou a mão primeiro?</h3><div class="tie-grid">${state.tieTeams.map(i=>`<button class="btn big" onclick="tieAnswer(${i})">${esc(state.teams[i].name)}</button>`).join("")}</div>`:""}
 <div style="margin-top:18px"><button class="btn" onclick="closeModal()">Fechar</button></div>`;
 back.classList.add("show")
}
function tieNext(){if(state.tieClue<3){state.tieClue++;showTieModal()}}
function tieReady(){state.tieReady=true;showTieModal();toast("Valendo!")}
function tieAnswer(i){
 const guess=prompt(`A equipe ${state.teams[i].name} acertou? Digite SIM ou NÃO.`,"SIM");
 if((guess||"").trim().toUpperCase()==="SIM"){toast(`${state.teams[i].name} venceu o desempate!`);closeModal();state.teams[i].score+=1;renderGame()}
 else{state.tieTeams=state.tieTeams.filter(x=>x!==i);if(state.tieTeams.length===1){toast(`${state.teams[state.tieTeams[0]].name} vence por eliminação.`);closeModal();}else{state.tieReady=true;showTieModal()}}
}
function closeModal(){document.getElementById("modalBack").classList.remove("show")}
function renderCredits(){
 shell(`<section class="credits-hero">
   <div class="kicker">Créditos e autoria</div>
   <h1 class="credits-mark">PERFIL NUTRIÇÃO</h1>
   <p style="font-size:18px;line-height:1.55;max-width:780px;margin:0">Cartas e Adivinhação: Desvendando a Nutrição Clínica</p>
   <div class="credit-grid">
     <div class="panel">
       <div class="credit-line"><small>Autoria</small><strong>Beatriz Spena Machado</strong></div>
       <div class="credit-line"><small>Instituição</small><strong>Universidade Federal Fluminense — UFF</strong></div>
       <div class="credit-line"><small>Atividade</small><strong>Monitoria de Nutrição Clínica II</strong></div>
       <div class="credit-line"><small>Ano</small><strong>2026</strong></div>
     </div>
     <div class="panel">
       <div class="credit-line"><small>Desenvolvimento da versão digital</small><strong>Beatriz Spena Machado, com assistência do ChatGPT (OpenAI)</strong></div>
       <div class="credit-line"><small>Base do material</small><strong>Baralho e manual da atividade de monitoria</strong></div>
       <div class="credit-note"><b>Uso de inteligência artificial:</b> o ChatGPT (OpenAI) foi utilizado como ferramenta de apoio para organização, programação e desenvolvimento da interface digital. A seleção, organização, revisão e responsabilidade pelo conteúdo pedagógico são da autora.</div>
     </div>
   </div>
 </section>`);
}
function renderRules(){
 shell(`<div class="page-head"><div><h1>Como jogar</h1><p>Regras reproduzidas e organizadas a partir do manual fornecido.</p></div><button class="btn" onclick="go('game')">Ir para o jogo</button></div>
 <div class="rules">
 <section class="panel"><h3>Objetivo</h3><p>Descobrir corretamente o conceito apresentado em cada carta utilizando o menor número possível de pistas. A equipe que acumular a maior pontuação ao final da partida é a vencedora.</p>
 <h3>Categorias</h3><ol><li>Patologia</li><li>Hormônios</li><li>Sinais Clínicos</li><li>Marcadores Laboratoriais</li><li>Nutrientes, enzimas e substâncias</li></ol></section>
 <section class="panel"><h3>Organização</h3><p><b>Equipes:</b> a turma é dividida em equipes de 6 participantes.</p><p><b>Representante:</b> cada equipe escolhe um porta-voz para apresentar a resposta oficial.</p><p><b>Mediador:</b> o monitor sorteia e lê as cartas, controla o tempo, valida os palpites e gerencia a pontuação.</p></section>
 <section class="panel"><h3>Início da rodada</h3><ol><li>O mediador sorteia uma carta e anuncia apenas a categoria.</li><li>O texto da carta e a resposta permanecem ocultos.</li><li>O mediador lê a 1ª pista, valendo 6 pontos.</li><li>A equipe tem até 30 segundos para discutir.</li><li>O porta-voz responde ou passa.</li></ol></section>
 <section class="panel"><h3>Se acertar</h3><p>A equipe recebe a pontuação correspondente à pista atual e a rodada termina. O mediador faz uma breve contextualização teórica e sorteia uma nova carta.</p>
 <h3>Se errar ou passar</h3><p>O direito de resposta passa para a equipe seguinte, em sentido horário, e o mediador lê a pista subsequente.</p></section>
 <section class="panel"><h3>Pontuação</h3><table class="score-table"><tr><th>Pista</th><th>Pontos</th></tr>${POINTS.map((p,i)=>`<tr><td>${i+1}ª pista</td><td><b>${p}</b></td></tr>`).join("")}</table></section>
 <section class="panel"><h3>Esgotamento</h3><p>O processo segue até uma equipe acertar ou até a 6ª pista. Se ninguém acertar, o mediador revela a resposta, explica brevemente o mecanismo clínico/fisiopatológico e inicia nova rodada.</p></section>
 <section class="panel" style="grid-column:1/-1"><h3>Desempate</h3><ol><li>O mediador sorteia uma carta inédita e lê as 3 primeiras pistas.</li><li>Ao concluir a 3ª pista, diz: <b>“1, 2, 3, valendo!”</b></li><li>Os representantes levantam a mão; quem levantar primeiro ganha o direito de resposta.</li><li>Se acertar, é campeã.</li><li>Se errar, é eliminada do desempate e a oportunidade passa às demais.</li><li>Se todas errarem, repete-se com nova carta até haver vencedora.</li></ol></section>
 </div>`);
}
render();
</script>
</body>
</html>
